name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify tag matches package versions
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          python - <<'PY' "$expected"
          from pathlib import Path
          import sys
          import tomllib

          expected = sys.argv[1]
          mismatches = []
          for path in sorted(Path("packages").glob("*/pyproject.toml")):
              data = tomllib.loads(path.read_text())
              name = data["project"]["name"]
              actual = data["project"]["version"]
              if actual != expected:
                  mismatches.append(f"{name}: {actual}")

          if mismatches:
              print(f"Tag {expected!r} does not match package versions:")
              print("\n".join(mismatches))
              raise SystemExit(1)
          PY

      - name: Build all workspace packages
        run: uv build --all-packages --out-dir dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  smoke-install:
    name: Smoke install (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install released ref as uv tool
        run: >-
          uv tool install --force
          "aimd-cli[all] @ git+https://github.com/${{ github.repository }}.git@${{ github.ref_name }}#subdirectory=packages/aimd"
          --with-executables-from aimd-api
          --with-executables-from aimd-mcp

      - name: Verify installed executables
        shell: bash
        run: |
          aimd --help >/dev/null
          python_bin="$(uv tool dir)/aimd-cli/bin/python"
          "$python_bin" - <<'PY'
          import aimd
          import aimd_api
          import aimd_mcp

          assert aimd.__name__ == "aimd"
          assert aimd_api.create_app().__class__.__name__ == "FastAPI"
          assert aimd_mcp.mcp.__class__.__name__ == "FastMCP"
          PY

  github-release:
    name: Publish GitHub Release
    needs:
      - build
      - smoke-install
    runs-on: ubuntu-latest

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  pypi-publish:
    name: Publish to PyPI
    needs:
      - build
      - smoke-install
    runs-on: ubuntu-latest

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Publish distributions to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.UV_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set +e
          output="$(uv publish 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qiE 'already exists|file already exists'; then
            echo "Version already exists on PyPI; skipping upload."
            exit 0
          fi
          exit "$status"
