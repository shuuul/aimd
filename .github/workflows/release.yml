name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag to rebuild/publish (e.g. v0.15.0). Leave empty for release-please only."
        required: false
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.flags.outputs.release_created }}
      tag_name: ${{ steps.flags.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag_name == '' }}
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resolve release outputs
        id: flags
        shell: bash
        run: |
          if [ -n "${MANUAL_TAG}" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${MANUAL_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=${RP_CREATED}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${RP_TAG}" >> "$GITHUB_OUTPUT"
          fi
        env:
          MANUAL_TAG: ${{ inputs.tag_name }}
          RP_CREATED: ${{ steps.release.outputs.release_created }}
          RP_TAG: ${{ steps.release.outputs.tag_name }}

  build:
    name: Build Python distributions
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="${RELEASE_TAG#v}"
          python - <<'PY' "$expected"
          import sys
          import tomllib

          expected = sys.argv[1]
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          name = data["project"]["name"]
          actual = data["project"]["version"]

          if actual != expected:
              print(f"Tag {expected!r} does not match {name} version {actual!r}")
              raise SystemExit(1)
          PY
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Build aimd-tool distribution
        run: uv build --out-dir dist

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  smoke-install:
    name: Smoke install (${{ matrix.os }})
    needs:
      - release-please
      - build
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install released ref as uv tool
        run: >-
          uv tool install --force
          "aimd-tool[all] @ git+https://github.com/${{ github.repository }}.git@${{ needs.release-please.outputs.tag_name }}"

      - name: Verify installed executables
        shell: bash
        run: |
          aimd --help >/dev/null
          command -v aimd-api >/dev/null
          command -v aimd-mcp >/dev/null
          python_bin="$(uv tool dir)/aimd-tool/bin/python"
          "$python_bin" - <<'PY'
          import aimd.core
          import aimd.interfaces.api
          import aimd.interfaces.mcp

          assert aimd.core.__name__ == "aimd.core"
          assert aimd.interfaces.api.create_app().__class__.__name__ == "FastAPI"
          assert aimd.interfaces.mcp.mcp.__class__.__name__ in {"FastMCP", "MCPServer"}
          PY

  github-release:
    name: Attach artifacts to GitHub Release
    needs:
      - release-please
      - build
      - smoke-install
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*

  pypi-publish:
    name: Publish to PyPI
    needs:
      - release-please
      - build
      - smoke-install
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          # This job only runs `uv publish` and never checks out the repo, so
          # there are no dependency files to key a cache on.
          enable-cache: false

      - name: Publish distributions to PyPI
        shell: bash
        run: |
          set +e
          output="$(uv publish --trusted-publishing always dist/aimd_tool-* 2>&1)"
          status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qiE 'already exists|file already exists'; then
            echo "Version already exists on PyPI; skipping upload."
            exit 0
          fi
          exit "$status"
