[package]
name = "aimd-engine"
description = "Model graphs, tokenizer and audio front-ends, generation loops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aimd-tensor = { workspace = true }
aimd-weights = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
aimd-mlx = { workspace = true, optional = true }

[features]
# MLX/Metal compute backend (the `[mlx]` variant wheel). Optional so the
# default CPU wheel stays free of the mlx link dependency.
mlx = ["dep:aimd-mlx"]

[dev-dependencies]
anyhow = { workspace = true }

[[example]]
name = "bench_asr_mlx"
required-features = ["mlx"]
