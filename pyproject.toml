[project]
name = "aimd"
version = "0.6.0"
description = "Context preparation tool for LLM workflows - Transcribe audio/video and convert documents"
readme = "README.md"
authors = [
    { name = "Shu Li", email = "zetarylee@gmail.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "aiohttp>=3.12.15",
    "fastapi>=0.116.1",
    "pandoc>=2.4",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.1",
    "rich>=13.9.4",
    "yt-dlp[default]>=2025.11.12",
    "torch>=2.9.1",
    "faster-whisper>=1.2.0; sys_platform != 'darwin'",
    "qwen-asr; sys_platform == 'linux'",
    "mlx-audio>=0.3.1; sys_platform == 'darwin'",
    "logly>=0.1.6",
    "typer>=0.20.0",
    "uvicorn>=0.35.0",
    "secretstorage>=3.5.0; sys_platform == 'linux'",
    "mcp>=1.18.0",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
aimd = "aimd.cli:main"
aimd-api = "aimd.api:main"
aimd-mcp = "aimd.mcp:main"


[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "prek>=0.2.13",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.8",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
