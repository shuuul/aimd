[project]
name = "aimd-tool"
version = "0.20.0"
description = "Context preparation tool for LLM workflows."
readme = "README.md"
authors = [
    { name = "Shu Li", email = "zetarylee@gmail.com" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    # addict/easydict/einops/matplotlib/torchvision are imported by
    # baidu/Unlimited-OCR's trust_remote_code model code at runtime; they are
    # not imported by aimd source directly. Do not remove them.
    "addict>=2.4.0",
    "easydict>=1.13",
    "einops>=0.8.2",
    "logly>=0.2.1",
    "markitdown>=0.1.7,<0.2.0",
    "matplotlib>=3.10.9",
    "mlx-audio>=0.4.4; sys_platform == 'darwin'",
    "mlx-vlm>=0.6.8; sys_platform == 'darwin' and python_version >= '3.12'",
    "pdf-inspector>=1.14.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    # secretstorage backs yt-dlp Chrome cookie decryption on Linux.
    "secretstorage>=3.5.0; sys_platform == 'linux'",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "typer>=0.27.0",
    "yt-dlp[default]>=2026.7.4",
]

[project.urls]
Homepage = "https://github.com/shuuul/aimd"
Repository = "https://github.com/shuuul/aimd"
Issues = "https://github.com/shuuul/aimd/issues"
Changelog = "https://github.com/shuuul/aimd/blob/main/CHANGELOG.md"

[project.optional-dependencies]
api = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
]
mcp = [
    "mcp>=2.0.0",
]
all = [
    "fastapi>=0.141.1",
    "mcp>=2.0.0",
    "uvicorn>=0.52.0",
]

[project.scripts]
aimd = "aimd.interfaces.cli:main"
aimd-api = "aimd.interfaces.api:main"
aimd-mcp = "aimd.interfaces.mcp.app:main"

[project.entry-points."markitdown.plugin"]
asr = "aimd.plugins.asr"
doc = "aimd.plugins.doc"
ocr = "aimd.plugins.ocr"
url = "aimd.plugins.url"

[dependency-groups]
dev = [
    "prek>=0.4.11",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "mcp>=2.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "aimd"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Pin the historical Ruff default surface (E4/E7/E9 + F). Leaving select unset
# currently expands to a much broader rule set and fails CI.
select = ["E4", "E7", "E9", "F"]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
