[project]
name = "aimd-tool"
version = "0.14.1"
description = "Context preparation tool for LLM workflows."
readme = { text = "Prepare LLM-ready context from URLs, audio/video, and documents.", content-type = "text/markdown" }
authors = [
    { name = "Shu Li", email = "zetarylee@gmail.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "addict>=2.4.0",
    "easydict>=1.13",
    "einops>=0.8.2",
    "logly>=0.1.6",
    "markitdown>=0.1.1,<0.2.0",
    "matplotlib>=3.10.9",
    "mlx-audio>=0.4.4; sys_platform == 'darwin'",
    "mlx-vlm>=0.6.3; sys_platform == 'darwin' and python_version >= '3.12'",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pydantic>=2.0.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.1.1",
    "rich>=13.9.4",
    "secretstorage>=3.5.0; sys_platform == 'linux'",
    "torch>=2.9.1",
    "torchvision>=0.27.1",
    "transformers>=4.57,<5.13",
    "typer>=0.20.0",
    "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
]
mcp = [
    "mcp>=1.18.0",
]
all = [
    "fastapi>=0.116.1",
    "mcp>=1.18.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
aimd = "aimd.interfaces.cli:main"
aimd-api = "aimd.interfaces.api:main"
aimd-mcp = "aimd.interfaces.mcp.app:main"

[project.entry-points."markitdown.plugin"]
asr = "aimd.plugins.asr"
doc = "aimd.plugins.doc"
ocr = "aimd.plugins.ocr"
url = "aimd.plugins.url"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "prek>=0.2.13",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.8",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "mcp>=1.18.0",
    "httpx2>=2.4.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "aimd"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
