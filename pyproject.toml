[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "prek>=0.2.13",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.8",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "mcp>=1.18.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
aimd-cli = { workspace = true }
aimd-api = { workspace = true }
aimd-media = { workspace = true }
aimd-mcp = { workspace = true }
aimd-book = { workspace = true }
aimd-ocr = { workspace = true }
aimd-html = { workspace = true }


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
