[project]
name = "aimd"
version = "0.8.5"
description = "Context preparation tool for LLM workflows - Transcribe audio/video and convert documents"
readme = "README.md"
authors = [
    { name = "Shu Li", email = "zetarylee@gmail.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "pandoc>=2.4",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.1",
    "rich>=13.9.4",
    "yt-dlp[default]>=2025.11.12",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "transformers>=4.40.0",
    "logly>=0.1.6",
    "typer>=0.20.0",
    "secretstorage>=3.5.0; sys_platform == 'linux'",
    "qwen-asr>=0.0.6; sys_platform == 'linux'",
    "mlx-audio>=0.4.4; sys_platform == 'darwin'",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
]
mcp = [
    "mcp>=1.18.0",
]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
aimd = "aimd.cli:main"
aimd-api = "aimd.api:main"
aimd-mcp = "aimd.mcp:main"


[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "prek>=0.2.13",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.8",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "mcp>=1.18.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]
torchaudio = [
    { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff.lint.per-file-ignores]
# Lazy exports via PEP 562 __getattr__; names resolve at runtime when api/mcp extras are installed.
"src/aimd/api.py" = ["F822"]
"src/aimd/mcp.py" = ["F822"]
