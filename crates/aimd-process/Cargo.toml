[package]
name = "aimd-process"
description = "Input routing and orchestration: local ASR/OCR over aimd-engine, remote OpenAI-compatible backends, model resolution, doc and URL dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aimd-core = { workspace = true }
aimd-engine = { workspace = true }
aimd-mlx = { workspace = true }
aimd-doc = { workspace = true }
aimd-url = { workspace = true }
serde_json = { workspace = true }
# Scanned/encoding-issue PDF probe (same library as the Python binding).
pdf-inspector = "1.25"
# HTTPS for remote OpenAI-compatible backends and HF checkpoint downloads.
ureq = { version = "3", default-features = false, features = ["rustls"] }
