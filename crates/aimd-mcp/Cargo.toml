[package]
name = "aimd-mcp"
description = "The `aimd-mcp` server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "aimd-mcp"
path = "src/main.rs"

[dependencies]
aimd-core = { workspace = true }
aimd-process = { workspace = true }
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "time"] }
