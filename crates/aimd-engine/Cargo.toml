[package]
name = "aimd-engine"
description = "MLX model graphs (Qwen3-ASR, Unlimited-OCR), tokenizer, audio/image front-ends, generation loops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
memmap2 = { workspace = true }
safetensors = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokenizers = { workspace = true }
image = { workspace = true }
aimd-mlx = { workspace = true, optional = true }
regex = "1"

[features]
default = ["mlx"]
mlx = ["dep:aimd-mlx"]

[[example]]
name = "aligner_parity"
required-features = ["mlx"]

[[example]]
name = "bench_asr_mlx"
required-features = ["mlx"]

[[example]]
name = "bench_ocr"
required-features = ["mlx"]

[[example]]
name = "corpus_gate"
required-features = ["mlx"]

[[example]]
name = "ppocrv6"
required-features = ["mlx"]
