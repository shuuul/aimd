[project]
name = "aimd-book"
version = "0.9.0"
description = "Ebook conversion package for aimd."
authors = [
    { name = "Shu Li", email = "zetarylee@gmail.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "logly>=0.1.6",
    "markitdown>=0.1.1,<0.2.0",
]

[project.entry-points."markitdown.plugin"]
aimd_book = "aimd_book"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
