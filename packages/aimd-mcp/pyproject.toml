[project]
name = "aimd-mcp"
version = "0.9.0"
description = "MCP server for aimd."
authors = [
    { name = "Shu Li", email = "zetarylee@gmail.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "aimd",
    "mcp>=1.18.0",
]

[project.scripts]
aimd-mcp = "aimd_mcp:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
