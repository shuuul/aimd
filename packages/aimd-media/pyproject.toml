[project]
name = "aimd-media"
version = "0.9.1"
description = "Media URL and audio/video transcription package for aimd."
authors = [
    { name = "Shu Li", email = "zetarylee@gmail.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "logly>=0.1.6",
    "markitdown>=0.1.1,<0.2.0",
    "secretstorage>=3.5.0; sys_platform == 'linux'",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "transformers>=4.57.6",
    "accelerate>=1.12.0",
    "yt-dlp[default]>=2025.11.12",
    "mlx-audio>=0.4.4; sys_platform == 'darwin'",
]

[project.entry-points."markitdown.plugin"]
aimd_media = "aimd_media"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
