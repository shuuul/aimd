[project]
name = "aimd"
version = "0.9.0"
description = "Context preparation tool for LLM workflows."
readme = { text = "Prepare LLM-ready context from URLs, audio/video, and documents.", content-type = "text/markdown" }
authors = [
    { name = "Shu Li", email = "zetarylee@gmail.com" }
]
requires-python = ">=3.10, <3.13"
dependencies = [
    "aimd-media",
    "aimd-book",
    "logly>=0.1.6",
    "markitdown>=0.1.1,<0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.1",
    "rich>=13.9.4",
    "typer>=0.20.0",
]

[project.optional-dependencies]
all = [
    "aimd-api",
    "aimd-mcp",
    "aimd-ocr",
    "aimd-html",
]

[project.scripts]
aimd = "aimd.cli:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
